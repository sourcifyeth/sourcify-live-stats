name: Deploy

on:
  push:
    branches: [staging, main]

# One deploy per branch at a time. A newer push waits; it does not cancel.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: sourcify-project
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/sourcify-project/docker/sourcify-live-stats

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    # staging branch -> "staging" environment, main branch -> "production".
    # The "production" environment must allow only the main branch
    # (GCP cannot check the branch, see README).
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1019539084286/locations/global/workloadIdentityPools/github/providers/sourcify
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:$DEPLOY_ENV" \
            .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$DEPLOY_ENV"

      # Only the image changes here. scripts/setup-gcp.sh owns the rest of
      # the service config, so deploys do not drift it.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "sourcify-$DEPLOY_ENV-live-stats" \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --quiet
